server.port=8080
spring.application.name=route-optimizer-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/route_optimizer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Teja@1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate DDL Auto - creates tables from Entities
spring.jpa.hibernate.ddl-auto=update

# Execute data.sql and schema.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
