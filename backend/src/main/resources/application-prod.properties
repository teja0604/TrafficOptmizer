server.port=${PORT:8080}
spring.application.name=route-optimizer-backend

# Neon PostgreSQL (production)
# Use env vars in production to avoid committing secrets.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-rapid-morning-a1jrelp2-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Don't auto-run data.sql in prod (it's currently MySQL-flavored).
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

# Enable request payload logging (activate in debug environments)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.com.routeoptimizer=INFO
